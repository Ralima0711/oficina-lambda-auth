AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  oficina-lambda-auth — Function serverless de autenticação por CPF que emite
  JWT RS256 (Tech Challenge SOAT Fase 3).

# RDS e VPC: parâmetros no deploy (nada de senha no Git).
# O RDS do lab é privado; VpcConfig nas mesmas subnets + SG próprio com
# egress 5432 para o SG do banco. O SG do RDS já libera 5432 na CIDR da VPC.
# Sem NAT, SSM (chave JWT) pode falhar — use VPC endpoints ou JWT_PRIVATE_KEY.
Parameters:
  DbHost:
    Type: String
    Default: ''
  DbPort:
    Type: String
    Default: '5432'
  DbName:
    Type: String
    Default: ''
  DbUser:
    Type: String
    Default: ''
  DbPassword:
    Type: String
    Default: ''
    NoEcho: true
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0c0cfeacc9c94245c
    Description: VPC do lab (a mesma do RDS)
  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: subnet-0e56277b8609e5c63,subnet-05dfd6d5578233ae7
    Description: Duas subnets em AZs diferentes (as mesmas do RDS)
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-074b6d544cb1e43b0
    Description: SG do RDS (oficina-mecanica-db-sg)

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs20.x
    Handler: src/handler.handler
    Environment:
      Variables:
        JWT_ISS: oficina-lambda-auth
        JWT_AUD: oficina-mecanica-api
        JWT_TTL: '3600'
        SSM_PRIVATE_KEY_PARAM: /oficina/auth/jwt-private-key
        DB_HOST: !Ref DbHost
        DB_PORT: !Ref DbPort
        DB_NAME: !Ref DbName
        DB_USER: !Ref DbUser
        DB_PASSWORD: !Ref DbPassword

Resources:
  AuthFunctionSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda auth — egress RDS 5432 e HTTPS (SSM)
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          DestinationSecurityGroupId: !Ref RdsSecurityGroupId
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: oficina-mecanica
        - Key: Stack
          Value: lambda-auth

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds:
          - !Ref AuthFunctionSg
      Events:
        AuthApi:
          Type: Api
          Properties:
            Path: /auth
            Method: post
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Sid: ReadJwtPrivateKey
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/oficina/auth/jwt-private-key'

Outputs:
  AuthFunctionName:
    Description: Nome da function para o plugin aws-lambda do Kong
    Value: !Ref AuthFunction
  AuthFunctionSecurityGroupId:
    Description: SG da Lambda (egress para o SG do RDS)
    Value: !Ref AuthFunctionSg
  AuthApiEndpoint:
    Description: Endpoint do POST /auth
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth'
