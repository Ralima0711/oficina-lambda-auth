AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  oficina-lambda-auth — Function serverless de autenticação por CPF que emite
  JWT RS256 (Tech Challenge SOAT Fase 3).

# Nada de identificador de ambiente neste arquivo: VPC, subnets, SG do RDS,
# role e credenciais entram por parameter-overrides (secrets do CI ou
# samconfig.toml local). Sem os overrides o template continua válido e faz
# deploy da função fora da VPC.
#
# O RDS do lab é privado: com VpcId preenchido a função sobe nas mesmas
# subnets, com SG próprio e egress 5432 para o SG do banco (que já libera
# 5432 na CIDR da VPC — ver oficina-infra-database/main.tf).
#
# Dentro da VPC, sem NAT nem VPC endpoint, a chamada ao SSM não completa.
# Enquanto o lab não tiver endpoint, passe a chave privada em
# JwtPrivateKeyB64 (exceção registrada no ADR-0004).
Parameters:
  DbHost:
    Type: String
    Default: ''
  DbPort:
    Type: String
    Default: '5432'
  DbName:
    Type: String
    Default: ''
  DbUser:
    Type: String
    Default: ''
  DbPassword:
    Type: String
    Default: ''
    NoEcho: true
  DbSslInsecure:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      'true' aceita o certificado do RDS sem validar a cadeia — use APENAS no
      lab do AWS Academy, onde o CA bundle não está disponível. Em produção
      mantenha 'false' e forneça o CA em DB_SSL_CA.
  JwtPrivateKeyB64:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      Chave privada RSA em base64 (PEM codificado). Só preencha enquanto a
      função não alcançar o SSM de dentro da VPC. Vazio = a função lê a chave
      do SSM Parameter Store, que é o caminho padrão (ADR-0004).
  VpcId:
    Type: String
    Default: ''
    Description: VPC do RDS. Vazio = função fora da VPC.
  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Duas subnets em AZs diferentes (as mesmas do RDS).
  RdsSecurityGroupId:
    Type: String
    Default: ''
    Description: SG do RDS (destino do egress 5432 da função).
  LabRoleArn:
    Type: String
    Default: ''
    Description: >
      ARN de uma role existente. O AWS Academy não permite iam:CreateRole, e
      nele usamos a LabRole. Vazio = o SAM cria a role da função.

Conditions:
  UsarVpc: !Not [!Equals [!Ref VpcId, '']]
  UsarRoleExistente: !Not [!Equals [!Ref LabRoleArn, '']]

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs20.x
    Handler: src/handler.handler
    Environment:
      Variables:
        JWT_ISS: oficina-lambda-auth
        JWT_AUD: oficina-mecanica-api
        JWT_TTL: '3600'
        SSM_PRIVATE_KEY_PARAM: /oficina/auth/jwt-private-key
        JWT_PRIVATE_KEY_B64: !Ref JwtPrivateKeyB64
        DB_HOST: !Ref DbHost
        DB_PORT: !Ref DbPort
        DB_NAME: !Ref DbName
        DB_USER: !Ref DbUser
        DB_PASSWORD: !Ref DbPassword
        DB_SSL_INSECURE: !Ref DbSslInsecure

Resources:
  AuthFunctionSg:
    Type: AWS::EC2::SecurityGroup
    Condition: UsarVpc
    Properties:
      GroupDescription: Lambda auth egress RDS 5432 and HTTPS SSM
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          DestinationSecurityGroupId: !Ref RdsSecurityGroupId
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: oficina-mecanica
        - Key: Stack
          Value: lambda-auth

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Role: !If [UsarRoleExistente, !Ref LabRoleArn, !Ref 'AWS::NoValue']
      VpcConfig: !If
        - UsarVpc
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds:
            - !Ref AuthFunctionSg
        - !Ref 'AWS::NoValue'
      # Quando o SAM cria a role (fora do Academy), ela vem com o mínimo:
      # ler só o parâmetro da chave privada e anexar a função à VPC.
      Policies: !If
        - UsarRoleExistente
        - !Ref 'AWS::NoValue'
        - - Statement:
              - Sid: ReadJwtPrivateKey
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/oficina/auth/jwt-private-key'
          - VPCAccessPolicy: {}
      Events:
        AuthApi:
          Type: Api
          Properties:
            Path: /auth
            Method: post

Outputs:
  AuthFunctionName:
    Description: Nome da function para o plugin aws-lambda do Kong
    Value: !Ref AuthFunction
  AuthFunctionSecurityGroupId:
    Condition: UsarVpc
    Description: SG da Lambda (egress para o SG do RDS)
    Value: !Ref AuthFunctionSg
  AuthApiEndpoint:
    Description: Endpoint do POST /auth
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth'
