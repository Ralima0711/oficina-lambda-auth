AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  oficina-lambda-auth — Function serverless de autenticação por CPF que emite
  JWT RS256 (Tech Challenge SOAT Fase 3).

# Endpoint e credenciais do RDS. Valores são passados no deploy
# (parameter-overrides / Secrets Manager) — nada de senha hardcoded aqui.
# Nota: o RDS do lab é privado (VPC); a função precisa de VpcConfig
# (subnets privadas + security group) para alcançá-lo — alinhar os IDs com o
# time de infra antes do teste ponta-a-ponta.
Parameters:
  DbHost:
    Type: String
    Default: ''
  DbPort:
    Type: String
    Default: '5432'
  DbName:
    Type: String
    Default: ''
  DbUser:
    Type: String
    Default: ''
  DbPassword:
    Type: String
    Default: ''
    NoEcho: true

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: nodejs20.x
    Handler: src/handler.handler
    Environment:
      Variables:
        JWT_ISS: oficina-lambda-auth
        JWT_AUD: oficina-mecanica-api
        JWT_TTL: '3600'
        SSM_PRIVATE_KEY_PARAM: /oficina/auth/jwt-private-key
        DB_HOST: !Ref DbHost
        DB_PORT: !Ref DbPort
        DB_NAME: !Ref DbName
        DB_USER: !Ref DbUser
        DB_PASSWORD: !Ref DbPassword

Resources:
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Events:
        AuthApi:
          Type: Api
          Properties:
            Path: /auth
            Method: post
      Policies:
        - Statement:
            - Sid: ReadJwtPrivateKey
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/oficina/auth/jwt-private-key'

Outputs:
  AuthFunctionName:
    Description: Nome da function para o plugin aws-lambda do Kong
    Value: !Ref AuthFunction
  AuthApiEndpoint:
    Description: Endpoint do POST /auth
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth'
