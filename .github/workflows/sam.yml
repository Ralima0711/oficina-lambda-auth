name: SAM CI/CD

on:
  push:
    branches: [homolog, main]
  pull_request:
    branches: [homolog, main]

permissions:
  contents: read
  id-token: write

env:
  AWS_DEFAULT_REGION: us-east-1
  HAS_AWS: "${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}"

jobs:
  build:
    name: SAM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install npm dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: SAM build
        run: sam build

  deploy:
    name: SAM deploy
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/homolog' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Skip deploy (sem credenciais AWS)
        if: env.HAS_AWS != 'true'
        run: |
          echo "Deploy ignorado. Cadastre AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY nos secrets."

      - name: Configure AWS credentials
        if: env.HAS_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: SAM build
        if: env.HAS_AWS == 'true'
        run: |
          npm ci
          sam build

      - name: SAM deploy
        if: env.HAS_AWS == 'true'
        env:
          STACK: ${{ github.ref == 'refs/heads/main' && 'oficina-lambda-auth-prod' || 'oficina-lambda-auth-homolog' }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          LAMBDA_VPC_ID: ${{ secrets.LAMBDA_VPC_ID }}
          LAMBDA_SUBNET_IDS: ${{ secrets.LAMBDA_SUBNET_IDS }}
          LAMBDA_RDS_SG_ID: ${{ secrets.LAMBDA_RDS_SG_ID }}
          LAB_ROLE_ARN: ${{ secrets.LAB_ROLE_ARN }}
          DB_SSL_INSECURE: ${{ secrets.DB_SSL_INSECURE }}
          JWT_PRIVATE_KEY_B64: ${{ secrets.JWT_PRIVATE_KEY_B64 }}
        run: |
          set -eo pipefail

          # O template não guarda nenhum identificador de ambiente: se um
          # secret faltar, o deploy falha aqui com o nome dele — em vez de
          # subir uma função sem VPC que só erra em runtime.
          FALTANDO=()
          for VAR in DB_HOST DB_NAME DB_USER DB_PASSWORD \
                     LAMBDA_VPC_ID LAMBDA_SUBNET_IDS LAMBDA_RDS_SG_ID LAB_ROLE_ARN; do
            if [ -z "${!VAR}" ]; then
              FALTANDO+=("$VAR")
            fi
          done
          if [ ${#FALTANDO[@]} -gt 0 ]; then
            echo "::error::Secrets obrigatorios ausentes: ${FALTANDO[*]}"
            exit 1
          fi

          # Sem VPC endpoint para o SSM, a chave precisa vir por parametro.
          if [ -z "$JWT_PRIVATE_KEY_B64" ]; then
            echo "::warning::JWT_PRIVATE_KEY_B64 vazio - a funcao vai buscar a chave no SSM."
          fi

          OVERRIDES=(
            "DbHost=$DB_HOST"
            "DbPort=${DB_PORT:-5432}"
            "DbName=$DB_NAME"
            "DbUser=$DB_USER"
            "DbPassword=$DB_PASSWORD"
            "DbSslInsecure=${DB_SSL_INSECURE:-false}"
            "VpcId=$LAMBDA_VPC_ID"
            "VpcSubnetIds=$LAMBDA_SUBNET_IDS"
            "RdsSecurityGroupId=$LAMBDA_RDS_SG_ID"
            "LabRoleArn=$LAB_ROLE_ARN"
            "JwtPrivateKeyB64=$JWT_PRIVATE_KEY_B64"
          )

          sam deploy \
            --stack-name "$STACK" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${OVERRIDES[@]}"
